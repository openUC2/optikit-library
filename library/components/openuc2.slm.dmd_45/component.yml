kind: optical_component
id: openuc2.slm.dmd_45
version: 0.1.1
category: slm
description: DLP digital micromirror device at 45° (0.47" 1920x1080, 5.4 µm pitch)
tags: [slm, dmd, structured-illumination, programmable]
vendor:
  name: Texas Instruments
  mpn: DLP4710
programmable:
  mode: reflective
  pixel-pitch-um: 5.4
  resolution: [1920, 1080]
  fill-factor: 0.92
optics:
  frames:
    optical: {z-mm: 0.0}
  ports:
    # Same convention as openuc2.mirror.flat_45: beam in along local +z
    # (entry port faces -z), reflected arm out along local +x.
    front: {frame: optical, direction: -z}
    reflected: {frame: optical, direction: +x, after-surface: 0}
  fragment-file: optics.optiland.yml
