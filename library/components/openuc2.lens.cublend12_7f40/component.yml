review:
  - "EFL/prescription mismatch: declared 40 mm (the part name says F40) but the
    authored surfaces — plano-convex, R = -25 mm, N-BK7 — give f = 48.1 mm
    (optiland's paraxial solve; the thin-lens formula agrees at 48.4). For f = 40
    the radius would be about -20.7 mm. One of the two is wrong; the Inventor
    import emits a placeholder radius when it cannot read one, so suspect that
    first. Surfaced by WP-232's sidecar check, 2026-08-29."
