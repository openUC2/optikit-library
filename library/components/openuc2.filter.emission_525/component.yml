kind: optical_component
# WP-74 reference seed: an emission (band-pass) filter — passes only its band,
# blocks everything else. The `response` block (kind: absorptive) is what makes
# the photon budget and the filter-stack check see it as more than a window.
# Copy this when authoring an excitation/emission filter.
id: openuc2.filter.emission_525
version: 0.1.0
category: filter
description: Band-pass emission filter, 510–560 nm (for a ~525 nm fluorophore)
tags: [fluorescence, reference]
docs: []
optics:
  frames:
    optical: {z-mm: 0.0}
  ports:
    front: {frame: optical, direction: -z}
    back: {frame: optical, direction: +z, after-surface: 0}
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: '.inf', conic: 0.0}
        thickness: 3.5
        semi_aperture: 12.5
        # WP-74: passes 510–560 nm, blocks the rest.
        response:
          kind: absorptive
          transmit-bands-um: [[0.510, 0.560]]
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
