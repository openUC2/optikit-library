# The starter achromat — the WP-75 optics-group exemplar to copy. A cemented
# doublet IS one optics group: the fragment carries a crown element
# (N-BAF10), a cement interface (material change, NO air gap), and a flint
# element (N-SF10). The numbers follow the proven AC254-050-A recipe
# (Ø25.4 mm, f ≈ 50 mm), so the edge thickness clears the printable minimum
# and a T3 holder generates with a single cavity for the cemented pair.
# `clear-aperture-mm` on both port frames feeds DRC_APERTURE (WP-79) and the
# generated holder's through-bore (WP-81).
kind: optical_component
id: openuc2.lens.achromat_starter
version: 0.1.0
category: lens
description: Starter cemented achromatic doublet, Ø25.4 mm, f ≈ 50 mm — the optics-group exemplar
tags: [starter, lens, lens/achromat]
effective_focal_length_mm: 50.17
optics:
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: 33.34, conic: 0.0}
        material_post: {type: Material, name: N-BAF10}
        thickness: 9.0
        is_stop: true
        semi_aperture: 12.7
      - type: standard
        geometry: {type: StandardGeometry, radius: -22.28, conic: 0.0}
        material_post: {type: Material, name: N-SF10}
        thickness: 2.5
        semi_aperture: 12.7
      - type: standard
        geometry: {type: StandardGeometry, radius: -291.07, conic: 0.0}
        semi_aperture: 12.7
  frames:
    optical: {z-mm: 0.0, clear-aperture-mm: 22.86}
    exit: {z-mm: 11.5, clear-aperture-mm: 22.86}
  ports:
    front: {frame: optical, direction: -z}
    back: {frame: exit, direction: +z, after-surface: 2}
