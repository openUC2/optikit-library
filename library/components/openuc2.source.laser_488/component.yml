# Optical component: a collimated 488 nm laser source. Emits along local +z.
# The `emit` datum was authored in the part-binding workbench (WP-19): the
# beam originates at the FRONT APERTURE of the housing, +20 mm along local z
# from the part center — NOT at the node origin. Chain inference starts its
# walk from this point.
kind: optical_component
id: openuc2.source.laser_488
version: 1.2.0
category: source
description: Collimated 488 nm laser diode module (emission datum at z = +20 mm)
tags: [source, source/laser]
optics:
  frames:
    optical: {z-mm: 0.0}
    emit: {z-mm: 20.0}
  ports:
    out: {frame: emit, direction: +z}
  # Physical emission model (canvas spec §9.5): a small collimated bundle, so
  # a lens downstream visibly focuses it. Beam radius is physics and lives
  # here; ray counts are trace_quality rendering policy and do not.
  emission:
    port: out
    spectrum:
      - {wavelength_um: 0.488, weight: 1.0}
    spatial: {type: disc, radius_mm: 1.0}
    angular: {type: collimated}
    flux: 1.0
vendor: {name: openUC2, mpn: LASER-488-COL}
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
