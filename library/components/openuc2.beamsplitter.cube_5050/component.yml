kind: optical_component
# A non-polarizing 50/50 beamsplitter cube. Unlike the dichroic reference
# (openuc2.dichroic.filter_dichroic) the split is spectrally flat: the
# `response` block is `kind: sampler` with a transmit ratio, so path inference
# keeps BOTH arms at every wavelength and the photon budget halves the power
# (WP-74). The Scene3 materializer maps the reflective flat to an explicit
# 50/50 R/T surface on both faces (canvas spec 9.2).
id: openuc2.beamsplitter.cube_5050
version: 0.1.0
category: beamsplitter
description: Non-polarizing 50/50 beamsplitter cube
tags: [beamsplitter, beamsplitter/cube, beamsplitter/non-polarizing]
docs: []
optics:
  frames:
    optical: {z-mm: 0.0}
  ports:
    front: {frame: optical, direction: -z}
    transmitted: {frame: optical, direction: +z, after-surface: 0}
    reflected: {frame: optical, direction: +x, after-surface: 0}
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: .inf, conic: 0.0}
        interaction_model: {type: refractive_reflective, is_reflective: true}
        semi_aperture: 12.5
        response:
          kind: sampler
          transmit-ratio: 0.5
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
