optikit-version: v0.0.0-alpha.1
design:
  description: excfilsldd25wls485 in a 2x2 cube (bound)
  tags:
    - cube-module
components:
  body:
    kind: primitive
    category: mechanics
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: -z
  optic:
    kind: primitive
    category: beamsplitter
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            material_post:
              type: Material
              name: N-BK7
            thickness: 1
            interaction_model:
              type: refractive_reflective
              is_reflective: true
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            semi_aperture: 12.7
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: -y
          x: -z
        offset-deg:
          x: 30
          y: -35.264
          z: 54.736
      translation:
        offset-mm:
          z: 7.5
