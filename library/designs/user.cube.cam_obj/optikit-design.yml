optikit-version: v0.0.0-alpha.1
design:
  description: cam_obj in a 3x1 cube (bound)
  tags:
    - cube-module
components:
  body:
    kind: primitive
    category: mechanics
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +y
  optic:
    kind: primitive
    category: detector
    optics:
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: -z
      translation:
        offset-mm:
          x: -50
variants:
  seat-pz-px:
    description: as authored — the insert's home seat
  seat-px-py:
    description: insert seated +x / +y
    components:
      optic:
        pose:
