optikit-version: v0.0.0-alpha.1
design:
  description: user.lens.cubmanstgr10, decomposed (motion as inputs)
  tags:
    - decomposed
inputs:
  dz:
    kind: float64
    units: mm
    min: -5.0
    max: 5.0
    resolution: 0.05
components:
  cubmanstgr10:
    kind: primitive
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: 50
              conic: 0
            material_post:
              type: Material
              name: N-BK7
            thickness: 4
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -50
              conic: 0
            semi_aperture: 12.7
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +x
      translation:
        offset-mm:
          y: -50
          z: ~ inputs['dz'].value
  moving-0:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: moving-0.glb
    moving-nodes:
      - SUB - 0030 - OBJMNT+THRADA:1
    pose:
      translation:
        offset-mm:
          z: ~ inputs['dz'].value
  static:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: static.glb
