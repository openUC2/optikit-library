review:
  - "priced as the sheet's 'openUC2 LED 470nm - GFP/FITC set' row"
  - LED wire models (2 x 25 cm strands + plug) removed; the D28 cooling star, 6 mm out of the -y 
    face, is the design's own part so that the cube mesh fits its cell
  - condenser 8.5 mm from the emitter as built; ray-traced into the FRAME (Nikon 4x) the best 
    emitter to R70 distance is 7.0-8.0 mm, and 8.5 mm gives about 2/3 of that at 4x - reprint the 
    holder for 7.5 mm
