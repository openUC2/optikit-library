# The starter motorized z-stage cube — the WP-42 actuation exemplar (WP-68):
# the template's actuatable `dz` DOF is bound to its firmware object here in
# `electronics.axis-map` (same name in both records — `library validate`
# checks the contract).
kind: cube_module
id: openuc2.cube.z_motor
version: 0.2.0
description: Starter motorized z-stage cube — the exemplary firmware-bound trio to copy
tags: [starter, cube, cube/stage, cube/motorized]
# WP-230: subdesign-backed — dz is the design input driving the
# carriage's pose; the axis-map names that input.
design: openuc2.subdesign.z_motor@^0.1
template: openuc2.tpl.z_motor@^0.2
electronics:
  pcb: "kicad:z_stage_driver@2.1"
  firmware-contract: "uc2:can:motor_axis@1"
  axis-map:
    - {dof: dz, can-object: 0x6062}
footprint_grid: [1, 1, 1]
