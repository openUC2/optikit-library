optikit-version: v0.0.0-alpha.1
design:
  name: Laser Scanning Microscope
  description: This is a simple laser scanning microscope with a 2D camera
  tags:
  - laser scanning
  - confocal
components:
  laser-galvo:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.laser_galvo
    category: source
    optics:
      emission:
        spectrum:
        - wavelength_um: 0.532
          weight: 1
        spatial:
          type: disc
          radius_mm: 2.5
        angular:
          type: collimated
        flux: 1
      frames:
        optical:
          y-mm: -7.0
          z-mm: 18.0
          clear-aperture-mm: 5
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: +y
      translation:
        offset-grid:
          x: -2
          y: 1
    source:
      wavelengths_um:
      - 0.532
      beam_diameter_mm: 5
  lens-galvo-50:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.lens_galvo_50
    category: lens
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: 50
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 6
          semi_aperture: 12.7
        - type: standard
          geometry:
            type: StandardGeometry
            radius: -50
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: +y
          x: +x
      translation:
        offset-grid:
          y: 2
  lens-galvo-160:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.lens_galvo_160
    category: lens
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: 165
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 7
          semi_aperture: 12.7
        - type: standard
          geometry:
            type: StandardGeometry
            radius: -165
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 10
          z-mm: 0
        front:
          x-mm: 0
          y-mm: 10
          z-mm: 0
        back:
          x-mm: 0
          y-mm: 10
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: +y
          x: +x
      translation:
        offset-grid:
          y: 6
  beamsplitter-cube-50:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.beamsplitter_cube_50
    category: beamsplitter
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 1
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 12.7
          response:
            kind: sampler
            transmit-ratio: 0.5
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: +y
          x: +x
        offset-deg:
          y: 45.0
      translation:
        offset-grid:
          y: 8
    instantiation:
      variant: seat-my-px
  objective-4x:
    kind: primitive
    primitive:
      static-models:
        gltf: user.lens.objective_4x
    category: lens
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: 30
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 4
          semi_aperture: 5
        - type: standard
          geometry:
            type: StandardGeometry
            radius: -30
            conic: 0
          semi_aperture: 5
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: -z
          x: +x
      translation:
        offset-grid:
          y: 8
          z: 2
  camera-basic:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.camera_basic
    category: detector
    optics:
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
      translation:
        offset-grid:
          y: 8
          z: -1
    instantiation:
      variant: seat-mz-mx
  sample-holder-fixed:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.sample_holder_fixed
    category: sample
    optics:
      passthrough: true
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          x: -x
      translation:
        offset-grid:
          y: 8
          z: 3
  galvo-mirror-0:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.galvo_mirror
    category: mirror
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 5
      frames:
        optical:
          z-mm: 0.0
    pose:
      rotation:
        kind: grid
        grid:
          z: -y
          x: +z
        offset-deg:
          y: -45.0
      translation:
        offset-grid:
          y: 1
        offset-mm: {}
  galvo-mirror-1:
    kind: primitive
    category: mirror
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 5
      frames:
        optical:
          z-mm: 0.0
    pose:
      translation:
        offset-mm:
          z: 7.0
        offset-grid:
          y: 1
      rotation:
        kind: grid
        grid:
          z: +x
          x: +z
        offset-deg:
          y: 45.0
paths:
  from-laser-galvo:
    from: laser-galvo
    to: camera-basic
instantiation: {}
