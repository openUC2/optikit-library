            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 6
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 12.7
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
      ports:
        front:
          frame: optical
          direction:
          - 0.707
          - 0.707
          - 0
        reflected:
          frame: optical
          direction:
          - 0.707
          - -0.707
          - 0
          after-surface: 0
    pose:
      rotation:
        kind: grid
        grid:
          x: -x
      translation:
        offset-grid:
          x: 2
          y: -2
    mounting:
      rotation:
        kind: grid
        grid:
          x: -y
  cube-base:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.cube_base
    category: other
    optics:
      passthrough: true
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
      ports:
        front:
          frame: optical
          direction: -x
        back:
          frame: optical
          direction: +x
    pose:
      rotation:
        kind: grid
      translation:
        offset-grid:
