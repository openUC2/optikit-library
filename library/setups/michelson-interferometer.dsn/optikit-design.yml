optikit-version: v0.0.0-alpha.1
design:
  name: Michelson Interferometer
  version: 0.1.0
  description: This is a simple setup for a michelson interferometer
  tags:
  - Inteferometer
  - Michelson
components:
  laser-520-pointer:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.laser_520_pointer
    category: source
    optics:
      emission:
        spectrum:
        - wavelength_um: 0.532
          weight: 1
        spatial:
          type: disc
          radius_mm: 2.5
        angular:
          type: collimated
        flux: 1
      frames:
        optical:
          z-mm: 20.0
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: +y
      translation:
        offset-grid:
          x: -1
          y: -1
    source:
      wavelengths_um:
      - 0.532
      beam_diameter_mm: 5
  beamsplitter-cube-50:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.beamsplitter_cube_50
    category: beamsplitter
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 1
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 12.7
          response:
            kind: sampler
            transmit-ratio: 0.5
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: +y
          x: +x
        offset-deg:
          y: 45.0
      translation:
        offset-grid:
          x: 2
          y: -1
  mirror-kinematic:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.mirror_kinematic
    category: mirror
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 6
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 12.7
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: +y
      translation:
        offset-grid:
          x: 3
          y: -1
  mirror-kinematic-2:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.mirror_kinematic
    category: mirror
    optics:
      fragment:
        surfaces:
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          material_post:
            type: Material
            name: N-BK7
          thickness: 6
          interaction_model:
            type: refractive_reflective
            is_reflective: true
          semi_aperture: 12.7
        - type: standard
          geometry:
            type: StandardGeometry
            radius: .inf
            conic: 0
          semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
    pose:
      rotation:
        kind: grid
        grid:
          z: -y
          x: +x
      translation:
        offset-grid:
          x: 2
          y: -2
  cube-base:
    kind: primitive
    primitive:
      static-models:
        gltf: user.cube.cube_base
    category: other
    optics:
      passthrough: true
      frames:
