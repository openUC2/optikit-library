# Cube module ("library part"): binds the 25 mm achromat to the adaptive lens
# insert, with a motorized-focus electronics contract mapping `dz` to a CANopen
# object. This is the object the configurator sidebar shows.
kind: cube_module
id: openuc2.cube.lens_z
version: 1.1.0
description: Motorizable focus lens cube (25 mm achromat on a ±7.5 mm z insert)
tags: [cube, cube/lens, cube/motorized]
component: openuc2.lens.achromat_25mm_f50@^2
template: openuc2.tpl.lens_insert_25mm@^1
electronics:
  pcb: "kicad:z_stage_driver@2.1"
  firmware-contract: "uc2:can:motor_axis@1"
  axis-map:
    - {dof: dz, can-object: 0x6062}
footprint_grid: [1, 1, 1]
