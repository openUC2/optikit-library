# Mechanical template ("footprint"): a T2 adaptive 25 mm lens insert that can
# slide ±7.5 mm along the cube's z (optical) axis. `dz` is the load-bearing DOF.
kind: mechanical_template
id: openuc2.tpl.lens_insert_25mm
version: 1.0.0
class: adaptive
description: 25 mm lens insert with ±7.5 mm axial focus travel
tags: [insert, insert/lens]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
dof:
  - name: dz
    kind: translation
    axis: z
    range: [-7.5, 7.5]
    resolution: 0.05
    unit: mm
    actuatable: true
inventor: "urn:uc2:inventor:lens_insert_25mm@r1"
# T2 groove lattice (WP-35): holders clamp a groove pair; the holder origin
# sits at the pair midpoint, dz decomposes to pair + continuous δ_lens.
grooves: {pitch-mm: 5.0, count: 7, center-mm: 0.0}
optical_ports:
  front: {frame: optical, direction: -z}
  back: {frame: optical, direction: +z}
footprint_grid: [1, 1, 1]
review:
  - groove pitch-mm 5.0 is a placeholder — confirm d_g from the Inventor cube sketch
