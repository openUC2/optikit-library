# WP-19 placeholder: a first-surface mirror plate; the reflective plane passes
# through the part origin (substrate behind it).
kind: mechanical_template
id: openuc2.tpl.mirror_mount_1x1
version: 0.1.0
class: fixed
description: Placeholder flat-mirror mount (reflective plane at z = 0)
tags: [placeholder, insert/mirror]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
# WP-146: this export is y-up (the wrapper-node convention) — the file's
# +y is the cube's +z. Declaring it makes every mesh check exact and the
# renderers stop guessing from a node-rotation sniff.
mesh-frame: record
glb: model.glb
step: model.step
# Where the mechanics hold the optic (WP-35 verify-t1): the reflective plane
# passes through the cube center — the PLN - OPT marker pose.
frames:
  optical: {z-mm: 0.0}
optical_ports:
  front: {frame: optical, direction: -z}
footprint_grid: [1, 1, 1]
# T1 discrete configurations (Inventor positional representations, WP-34):
# which plane the reflective surface spans inside the cube.
states: [XY, YZ]
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
