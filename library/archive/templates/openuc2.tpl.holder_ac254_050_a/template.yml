# T3 generative holder (WP-21): the 1x1 insert body boolean-carved around the
# AC254-050-A placeholder at its bound pose (lens centered on the cube
# center), split into two printable halves with cut-off M3 fastening.
kind: mechanical_template
id: openuc2.tpl.holder_ac254_050_a
version: 0.1.0
class: generative
description: Printable boolean holder for the AC254-050-A doublet (two halves, M3 cut-offs)
tags: [holder, generated, insert/lens]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
generator:
  script: generators/boolean_holder_1x1.py
  params:
    part_step: library/components/thorlabs.lens.ac254-050-a/model.step
    part_position_mm: {z: -5.75}
    clearance_mm: 0.15
    split_plane: xz
    body_height_mm: 30
optical_ports:
  front: {frame: optical, direction: -z}
  back: {frame: optical, direction: +z}
footprint_grid: [1, 1, 1]
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
