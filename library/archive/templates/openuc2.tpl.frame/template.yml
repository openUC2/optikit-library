# WP-45: the FRAME as a carrier. The miniframe bay is the 3x3x2 inner-cube
# slot (the ~15x15x20 cm optical engine slides in on the rail system);
# `axis: +z` records the coaxial constraint — the bay's vertical beam is the
# FRAME objective axis.
kind: mechanical_template
id: openuc2.tpl.frame
version: 0.1.0
class: fixed
description: FRAME body with the 3x3x2 miniFRAME bay (rail system)
tags: [carrier, frame]
carrier: true
bays:
  miniframe:
    origin-cell: [1, 1, 0]
    size: [3, 3, 2]
    axis: +z
# WP-147: measured from the reduced body export (KHR_mesh_quantization —
# positions are normalized int16, the millimetres live in the node scale).
envelope: {x-mm: 310, y-mm: 397, z-mm: 398}
footprint_grid: [7, 8, 8]
glb: model.glb
# z-up: the body's z range starts at the floor, so the file already speaks
# the cube frame.
mesh-frame: cube
review:
  - >-
    model.glb is the REDUCED display body (glTF-Transform, quantized) — a
    placeholder for layout and scale, not manufacturing geometry
  - footprint_grid is derived from the measured envelope, not from the rail
    system's real cube capacity — verify against the FRAME CAD
