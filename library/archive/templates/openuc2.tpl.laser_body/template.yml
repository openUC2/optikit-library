# The laser body: a bare HOUSING (WP-67) — Ø30 x 95 mm cylinder, emission
# bezel at the front face. footprint_grid: null (not cube-mounted); a T3
# holder or the WP-84 Inventor path lands it on the grid later.
kind: mechanical_template
id: openuc2.tpl.laser_body
version: 0.1.0
class: fixed
description: Cylindrical laser module body (breadboard device — no cube)
tags: [reference, housing]
envelope: {x-mm: 40, y-mm: 40, z-mm: 110}
footprint_grid:
component: openuc2.source.laser_body@^0.1
step: laser_body.step
# WP-146: this export is y-up (the wrapper-node convention) — the file's
# +y is the cube's +z. Declaring it makes every mesh check exact and the
# renderers stop guessing from a node-rotation sniff.
mesh-frame: record
glb: laser_body.glb
optical_ports:
  out: {frame: optical, direction: +z}
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
