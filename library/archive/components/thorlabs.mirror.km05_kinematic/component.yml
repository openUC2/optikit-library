# WP-83 S2 reference: a KM05-class kinematic mirror ASSEMBLY — a catalog
# mount holding a circular mirror, modelled part-first: the optics are this
# record, the mount body is the HOUSING template (thorlabs.tpl.km05_kinematic,
# footprint_grid: null — not cube-mounted; WP-67), whose tip/tilt rotation
# DOFs swing the reflected arm (WP-80). Reviewed by hand; the mesh is a
# representative stand-in until a vendor STEP is attached (WP-84).
kind: optical_component
id: thorlabs.mirror.km05_kinematic
version: 0.1.0
category: mirror
description: KM05-class kinematic mount holding a Ø12.7 mm mirror — the S2 housed-assembly reference
tags: [reference, mirror, mirror/kinematic]
vendor: {name: Thorlabs, mpn: KM05, url: 'https://www.thorlabs.com/thorproduct.cfm?partnumber=KM05'}
mount_angle_deg: 45
optics:
  frames:
    optical: {z-mm: 0.0, clear-aperture-mm: 11.43}
  ports:
    front: {frame: optical, direction: -z}
    reflected: {frame: optical, direction: +x, after-surface: 0}
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: .inf, conic: 0.0}
        interaction_model: {type: refractive_reflective, is_reflective: true}
        semi_aperture: 6.35
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
