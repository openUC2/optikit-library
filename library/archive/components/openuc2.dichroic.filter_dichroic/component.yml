kind: optical_component
# WP-74 reference seed: a real dichroic — reflects below its cut-on, transmits
# above. Copy this when authoring a fluorescence beamsplitter; the `response`
# block is what lets inference tell the reflected excitation arm from the
# transmitted emission arm (a bare reflective flat is only a beamsplitter).
id: openuc2.dichroic.filter_dichroic
version: 0.1.0
category: dichroic
description: Long-pass dichroic (cut-on 505 nm) for fluorescence separation
tags:
  - fluorescence
  - reference
docs: []
optics:
  frames:
    optical:
      z-mm: 0.0
  ports:
    front:
      frame: optical
      direction: -z
    transmitted:
      frame: optical
      direction: +z
      after-surface: 0
    reflected:
      frame: optical
      direction: +x
      after-surface: 0
  fragment:
    surfaces:
      - type: standard
        geometry:
          type: StandardGeometry
          radius: '.inf'
        interaction_model:
          type: refractive_reflective
          is_reflective: true
        # WP-74: reflects below 505 nm, transmits above.
        response:
          kind: dichroic
          reflect-bands-um: [[null, 0.505]]
