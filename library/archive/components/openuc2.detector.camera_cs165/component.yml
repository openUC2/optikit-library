# Optical component: a CMOS camera detector. The sensor plane faces −z.
# The `sensor` datum was authored in the part-binding workbench (WP-19):
# the plane is recessed 10 mm behind the part center (z = −10 mm), behind
# the housing's front bore.
kind: optical_component
id: openuc2.detector.camera_cs165
version: 1.1.0
category: detector
description: CS165MU 1.6 MP CMOS camera (sensor datum at z = -10 mm)
tags: [detector, detector/camera]
optics:
  frames:
    optical: {z-mm: 0.0}
    sensor: {z-mm: -10.0}
  ports:
    sensor: {frame: sensor, direction: -z}
vendor: {name: Thorlabs, mpn: CS165MU}
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
