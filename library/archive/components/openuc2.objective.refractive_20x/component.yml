kind: optical_component
# A 20x objective as a REAL refractive stand-in: one biconvex N-BK7 singlet at
# the objective's effective focal length (180 mm tube standard / 20x = 9 mm),
# thin-lens radii R = 2(n-1)f with n(N-BK7) = 1.5168 - the same convention the
# WP-43 migration used for the tube lens. Unlike openuc2.objective.paraxial_20x
# (an ideal thin_lens interaction model the Scene3 dialect cannot represent),
# this record traces in the canvas kernel today. A singlet at NA 0.4 is
# aberrated - that is the honest physics of the stand-in, not a bug; swap in a
# real prescription when one is authored.
id: openuc2.objective.refractive_20x
version: 0.1.0
category: lens
description: 20x objective stand-in - biconvex singlet, f = 9 mm, NA 0.4 (kernel-traceable)
tags: [objective, objective/stand-in, starter]
docs: []
effective_focal_length_mm: 9.0
objective:
  magnification: 20
  numerical_aperture: 0.4
  tube_lens_f_mm: 180.0
optics:
  # The lens sits 41 mm toward the front (-z) of the cube center: a protruding
  # objective nose. On the 50 mm grid the neighbouring cube's center - the
  # sample plane - is then 9 mm from the lens, i.e. AT the front focus: epi
  # excitation focuses onto the sample, and the sample's emission leaves the
  # objective collimated, ready for a tube lens.
  frames:
    optical: {z-mm: -41.0}
    exit: {z-mm: -39.0}
  ports:
    front: {frame: optical, direction: -z}
    back: {frame: exit, direction: +z, after-surface: 1}
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: 9.3024, conic: 0.0}
        material_post: {type: Material, name: N-BK7}
        thickness: 2.0
        semi_aperture: 3.6
        is_stop: true
      - type: standard
        geometry: {type: StandardGeometry, radius: -9.3024, conic: 0.0}
        semi_aperture: 3.6
