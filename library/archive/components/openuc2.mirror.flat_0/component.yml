# Optical component: a normal-incidence flat mirror (retro-reflects).
# Counterpart to openuc2.mirror.flat_45 — both fold behaviors exist as DATA
# so the frontend never hardcodes a fold angle (WP-29).
kind: optical_component
id: openuc2.mirror.flat_0
version: 1.0.0
category: mirror
description: Flat first-surface mirror at normal incidence (reflects straight back)
tags: [mirror, mirror/flat, mirror/normal-incidence]
optics:
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: .inf, conic: 0.0}
        interaction_model: {type: refractive_reflective, is_reflective: true}
        semi_aperture: 12.5
  frames:
    optical: {z-mm: 0.0}
  ports:
    front: {frame: optical, direction: -z}
    reflected: {frame: optical, direction: -z, after-surface: 0}
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
