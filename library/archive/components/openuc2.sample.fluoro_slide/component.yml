kind: optical_component
# A fluorescently labelled slide: the sample as a SECONDARY SOURCE. The kernel's
# linear model has no excitation->emission coupling, so the fluorophore emits
# unconditionally at its emission line (~520 nm for a GFP-class dye under 488
# excitation) into a cone matching a 0.4 NA objective's acceptance
# (asin(0.4) = 23.6 deg). No fragment: the slide adds no surfaces, so the
# excitation beam passes the sample position freely while the emission path
# traces from here through the dichroic's transmitted arm to the camera.
id: openuc2.sample.fluoro_slide
version: 0.1.0
category: sample
description: Fluorescent sample - emits 520 nm into a 0.4 NA cone (secondary source)
tags: [sample, sample/fluorescent, fluorescence]
docs: []
optics:
  frames:
    optical: {z-mm: 0.0}
  ports:
    plane: {frame: optical, direction: +z}
  emission:
    port: plane
    spectrum:
      - {wavelength_um: 0.520, weight: 1.0}
    spatial: {type: disc, radius_mm: 0.1}
    angular: {type: cone, half_angle_deg: 23.6}
    flux: 1.0
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
