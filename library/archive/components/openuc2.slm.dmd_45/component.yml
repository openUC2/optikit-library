# WP-47 reference programmable surface: a DMD mounted at 45°, so it folds the
# beam 90° like a fold mirror while carrying its pixel facts. The PATTERN is
# not simulated — the micromirror array traces as one flat reflective plane.
kind: optical_component
id: openuc2.slm.dmd_45
version: 0.1.0
category: slm
description: DLP digital micromirror device at 45° (0.47" 1920x1080, 5.4 µm pitch)
tags: [slm, dmd, structured-illumination, programmable]
vendor:
  name: Texas Instruments
  mpn: DLP4710
programmable:
  mode: reflective
  pixel-pitch-um: 5.4
  resolution: [1920, 1080]
  fill-factor: 0.92
optics:
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: .inf, conic: 0.0}
        interaction_model: {type: refractive_reflective, is_reflective: true}
        semi_aperture: 6.6
  frames:
    optical: {z-mm: 0.0}
  ports:
    # Same convention as openuc2.mirror.flat_45: beam in along local +z
    # (entry port faces -z), reflected arm out along local +x.
    front: {frame: optical, direction: -z}
    reflected: {frame: optical, direction: +x, after-surface: 0}
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
