# The paraxial black box — the honest model of a catalog objective you have
# no prescription for (WP-75). ONE plano surface whose interaction model is
# optiland's ThinLensInteractionModel with the objective's EFL; NA, working
# distance, magnification and tube-lens reference are record FACTS (the
# schema is extra=allow), not invented surfaces. The compiler carries the
# authored interaction model through verbatim (WP-79); anything bogus raises
# E_INTERACTION. 20× on a 180 mm tube lens ⇒ f = 9 mm.
kind: optical_component
id: openuc2.objective.paraxial_20x
version: 0.1.0
category: lens
description: Paraxial 20× objective (black box) — one thin-lens surface, f = 9 mm, NA 0.4
tags: [starter, objective, objective/paraxial]
vendor: {name: '', mpn: '', url: ''}
effective_focal_length_mm: 9.0
objective:
  magnification: 20
  numerical_aperture: 0.4
  working_distance_mm: 1.2
  tube_lens_f_mm: 180.0
optics:
  fragment:
    surfaces:
      - type: standard
        geometry: {type: StandardGeometry, radius: .inf, conic: 0.0}
        interaction_model: {type: thin_lens, focal_length: 9.0}
        is_stop: true
        semi_aperture: 5.65
  frames:
    optical: {z-mm: 0.0, clear-aperture-mm: 11.3}
  ports:
    front: {frame: optical, direction: -z}
    back: {frame: optical, direction: +z, after-surface: 0}
