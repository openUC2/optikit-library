# OPM - 0004 - FLIM 488 as Inventor exports it (STEP AP214, mm). Rebuild:
# `optikit-core import assembly library/groups/openuc2.group.miniframe_laserscan/assembly.yml --step "OPM - 0004 - FLIM 488.stp"`
# The record: DOCS/editor/frame-assembly-contract.md.
source: "OPM - 0004 - FLIM 488.stp"
exported: 2026-09-09
# The lattice origin: the axis column (the 45° splitter under the top plate's
# window, x = 100, y = 350.6) at the OPM's LAYER-0 height (z = 0, the base
# plate's cube row — the export models the optics on the upper layer only).
origin-mm: [100.0, 350.6, 0.0]
pitch-mm: [50, 50, 55]

groups:
  - id: openuc2.group.miniframe_laserscan
    description: miniFRAME laser-scanning (FLIM 488) OPM — fiber-coupled laser on the plate tab, dichroic, XY galvo, f50/f160 relay, 45° splitter on the axis, detection into a fiber; two layers under a 3×8 plate
    tags: [opm, miniframe, laser-scanning, flim]
    nodes: ["OPM - 0004 - FLIM 488"]
    members:
      "ASS - 2077 - CUBKINSPL45":     openuc2.cube.mirror_45
      "ASS - 2078 - CUBKINDICSPL45":  openuc2.cube.filter_dichroic
      "ASS - 2075 - CUBGLV":          openuc2.cube.galvo_xy
      "ASS - 2073 - CUBLEND25F50":    openuc2.cube.cublend12_7f40
      "ASS - 2074 - CUBLEND25F160":   openuc2.cube.tube_lens_1x1
      "ASS - 2083 - CUBECCFIBHOL":    openuc2.cube.laser_488
      "ASS - 2084 - CUBECCADJFIBHOL": openuc2.cube.cube_1x1
    # The laser cube sits on the plate's +1×1 tab, outside the 3×8 plate.
    overhang:
      - "ASS - 2083 - CUBECCFIBHOL"
    # The export models the optical (upper) layer only; the assembly drawing
    # shows the lower layer's plain cubes under it (cells after the shift:
    # the dichroic column is x = 0, the galvo column x = 1).
    extra-members:
      low_00: {module: openuc2.cube.cube_1x1, cell: [0, 0, 0]}
      low_10: {module: openuc2.cube.cube_1x1, cell: [1, 0, 0]}
      low_01: {module: openuc2.cube.cube_1x1, cell: [0, 1, 0]}
      low_11: {module: openuc2.cube.cube_1x1, cell: [1, 1, 0]}
      low_15: {module: openuc2.cube.cube_1x1, cell: [1, 5, 0]}
      low_16: {module: openuc2.cube.cube_1x1, cell: [1, 6, 0]}
    # The CAD's plates: 3×8, one column wider than the cube stack (x = 2 is
    # empty) and one row longer at the laser end (y = -1 holds only joints).
    structure:
      plates:
        top:    {module: openuc2.cube.plate_3x8, origin: [0, -1], size: [3, 8]}
        bottom: {module: openuc2.cube.plate_3x8, origin: [0, -1], size: [3, 8]}
    interface:
      axis: {member: "ASS - 2077 - CUBKINSPL45", port: front}
    review:
      - the axis fold is a 25×25×1 splitter in a kinematic mount (`CUBKINSPL45°`), shipped as `mirror_45`; the f50 and f160 lens cubes ship as `cublend12_7f40` and `tube_lens_1x1` (nearest records — the EFLs differ)
      - the detection fiber cube (`CUBECCADJFIBHOL`) ships as a plain cube; the two filter slides between cubes (`EMIFILSLD`, `EXCFILSLD`) and the galvo-board cube hanging below the plate are not modelled
      - the lower layer's plain cubes come from `extra-members`, not from the export
