kind: cube_group
id: openuc2.group.miniframe_laserscan
version: 0.1.2
description: miniFRAME laser-scanning (FLIM 488) OPM — fiber-coupled laser on the plate tab, 
  dichroic, XY galvo, f50/f160 relay, 45° splitter on the axis, detection into a fiber; two layers 
  under a 3×8 plate
tags:
  - opm
  - miniframe
  - laser-scanning
  - flim
review:
  - measured from OPM - 0004 - FLIM 488.stp (exported 2026-09-09)
  - the axis fold is a 25×25×1 splitter in a kinematic mount (`CUBKINSPL45°`), shipped as 
    `mirror_45`; the f50 and f160 lens cubes ship as `cublend12_7f40` and `tube_lens_1x1` (nearest 
    records — the EFLs differ)
  - the detection fiber cube (`CUBECCADJFIBHOL`) ships as a plain cube; the two filter slides 
    between cubes (`EMIFILSLD`, `EXCFILSLD`) and the galvo-board cube hanging below the plate are 
    not modelled
  - the lower layer's plain cubes come from `extra-members`, not from the export
envelope-grid:
  - 2
  - 7
  - 2
