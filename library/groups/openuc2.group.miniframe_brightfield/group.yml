kind: cube_group
id: openuc2.group.miniframe_brightfield
version: 0.1.3
description: miniFRAME brightfield OPM — 3x3x2 cube stack, sandwich plates, camera arm
tags:
  - opm
  - miniframe
  - brightfield
docs:
  - https://docs.openuc2.com/usage/pro/miniframe/miniFRAME_DPC
review:
  - 'measured from FRAME #0007 - Microscope incl accessories.step (exported 2026-09-08)'
  - the two `CUBTBSHOLD28.5` tube-holder cubes and the C-mount tubus are shipped as `cube_1x1` + 
    `camera_basic`; the camera body sits 12.5 mm off its cell
  - the OPM sits 0.5 mm off the illumination axis in this export (y = -0.5); cells are snapped
  - "'BUY - HIKROBOT - Camera - MV-CS060-10UC-PRO:1' sits 11.8 mm off its cell"
envelope-grid:
  - 3
  - 3
  - 2
members:
  cube_1x1:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 0
      - 2
      - 0
  cube_1x1_2:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 2
      - 2
      - 0
  cube_1x1_3:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 0
      - 0
      - 0
  cube_1x1_4:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 1
      - 1
      - 1
  cube_1x1_5:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 0
      - 2
      - 1
  cube_1x1_6:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 1
      - 2
      - 1
  cube_1x1_7:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 2
      - 2
      - 1
  mirror_45:
    module: openuc2.cube.mirror_45@^0.1
    cell:
      - 1
      - 2
      - 0
  tube_lens_1x1:
    module: openuc2.cube.tube_lens_1x1@^0.1
    cell:
      - 1
      - 1
      - 0
  cube_1x1_8:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 1
      - -1
      - 0
    overhang: true
  cube_1x1_9:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 1
      - -2
      - 0
    overhang: true
  pinhole_1x1:
    module: openuc2.cube.pinhole_1x1@^0.1
    cell:
      - 2
      - 0
      - 0
  cube_1x1_10:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 0
      - 0
      - 1
  cube_1x1_11:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 1
      - 0
      - 1
  cube_1x1_12:
    module: openuc2.cube.cube_1x1@^0.1
    cell:
      - 2
      - 0
      - 1
  camera_basic:
    module: openuc2.cube.camera_basic@^0.1
    cell:
      - 1
      - -3
      - 0
    overhang: true
structure:
  plates:
    bottom:
      module: openuc2.cube.plate_3x3@^0.1
      origin:
        - 0
        - 0
      size:
        - 3
        - 3
    top:
      module: openuc2.cube.plate_3x3@^0.1
      origin:
        - 0
        - 0
      size:
        - 3
        - 3
  joints: puzzle
  joint-cells:
    -   - 0
        - 0
        - 1
    -   - 0
        - 2
        - 1
    -   - 1
        - 1
        - 1
    -   - 1
        - 2
        - 1
    -   - 2
        - 0
        - 1
    -   - 2
        - 2
        - 1
interface:
  axis:
    member: mirror_45
    port: front
  camera:
    member: camera_basic
    port: sensor
