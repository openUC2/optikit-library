# Mechanical template ("footprint"): T3 generative round-optic insert for a
# 1x1 cube. The geometry is regenerated headlessly from generator parameters
# (WP-10 harness: optikit-core generate openuc2.tpl.round_optic_insert_1x1);
# the insert interface is fixed, measured from the MASINS reference geometry.
kind: mechanical_template
id: openuc2.tpl.round_optic_insert_1x1
version: 0.1.1
class: generative
description: Parametric round-optic insert (clear aperture / optic diameter / edge thickness)
tags: [insert, insert/round-optic, generated]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
# WP-230: the parameter DOFs are retired. They mirrored the generator's
# params JSON Schema so back-annotation could classify a change as
# PART_PARAM — but that check reads the DESIGN component's `dof`, never
# the template's, so this block was a copy nothing consulted. The
# generator's own params schema stays the one source of truth.
generator:
  script: generators/round_optic_insert_1x1.py
  params:
    clear_aperture_mm: 22.0
    optic_diameter_mm: 25.4
    edge_thickness_mm: 2.0
optical_ports:
  front: {frame: optical, direction: -z}
  back: {frame: optical, direction: +z}
footprint_grid: [1, 1, 1]
