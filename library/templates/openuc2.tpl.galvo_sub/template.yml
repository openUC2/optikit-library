# Mechanical template for the DECOMPOSED dual-axis galvo (WP-202).
#
# Deliberately declares NO dof: — and that is the point of the decomposition.
# The compact sibling (openuc2.tpl.galvo_dual) has to carry `tilt_x`/`tilt_y`
# here, each naming the fragment `surface:` it drives and the `pivot-frame:`
# it turns about, because its optics are one record with two surfaces and a
# DOF has no other way to say which mirror it means. In the subdesign spelling
# each mirror is a component that owns its own DOF, so this template is what a
# template should be: the mechanics (envelope, footprint) and nothing else.
#
# Firmware binds the DESIGN's input variables (tilt-x / tilt-y), not DOFs
# here — see openuc2.cube.galvo_sub's axis-map.
kind: mechanical_template
id: openuc2.tpl.galvo_sub
version: 0.1.0
class: adaptive
description: Dual-axis galvo mount, decomposed (mechanics only — the mirrors own their motion)
tags: [insert, insert/galvo, actuated, subdesign]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
footprint_grid: [1, 1, 1]
