# Mechanical template for the dual-axis galvo (WP-42): T2 adaptive, two
# rotation DOFs — each drives its own mirror surface about its own pivot frame,
# ranged and firmware-actuatable.
kind: mechanical_template
id: openuc2.tpl.galvo_dual
version: 0.1.0
class: adaptive
description: Dual-axis galvo mount (two actuated steering mirrors)
tags: [insert, insert/galvo, actuated]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
dof:
  - name: tilt_x
    kind: rotation
    axis: x
    pivot-frame: pivot_x
    surface: 0
    range: [-15.0, 15.0]
    resolution: 0.01
    unit: deg
    actuatable: true
  - name: tilt_y
    kind: rotation
    axis: y
    pivot-frame: pivot_y
    surface: 1
    range: [-15.0, 15.0]
    resolution: 0.01
    unit: deg
    actuatable: true
optical_ports:
  front: {frame: optical, direction: -x}
  reflected: {frame: optical, direction: -y}
footprint_grid: [1, 1, 1]
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
