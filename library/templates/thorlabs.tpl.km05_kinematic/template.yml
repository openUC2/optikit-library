# The KM05 mount body: a bare HOUSING (WP-67) — footprint_grid: null, no
# cube; the template carries the component ref itself. tip/tilt are the
# mount's adjuster screws: rotation DOFs about the mirror frame (WP-80),
# not firmware-actuated.
kind: mechanical_template
id: thorlabs.tpl.km05_kinematic
version: 0.1.1
class: adaptive
description: KM05-class kinematic mount housing (tip/tilt, breadboard-mounted — no cube)
tags: [reference, housing]
envelope: {x-mm: 40, y-mm: 40, z-mm: 60}
footprint_grid:
component: thorlabs.mirror.km05_kinematic@^0.1
step: km05_kinematic.step
glb: km05_kinematic.glb
# The GLB is a y-up export: its root node carries the Rx(-90°) wrapper, so the
# file's own axes are the viewer's, not the cube's. Undeclared, the checks read
# the mesh in file axes and saw a plate 60° off the declared -z -> +x fold (and
# a 41.2 x 43.7 x 32.0 box that fits 40 x 40 x 60 only permuted). `record` is
# the sugar for exactly this convention (file y = cube z, file z = cube -y);
# under it the plate lands on (+0.707, 0, -0.707), which IS the 45° fold.
mesh-frame: record
dof:
  - {name: tip, kind: rotation, axis: x, unit: deg, range: [-4, 4], pivot-frame: optical}
  - {name: tilt, kind: rotation, axis: y, unit: deg, range: [-4, 4], pivot-frame: optical}
optical_ports:
  front: {frame: optical, direction: -z}
  reflected: {frame: optical, direction: +x}
review:
  - carried over from the pre-reset library — the prescription has NOT been confirmed against a real
    part. Verify it in the component editor and delete this note before using it in a design you 
    intend to build.
