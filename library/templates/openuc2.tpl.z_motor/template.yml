# The starter motorized z-stage template — T2 adaptive (WP-68). One
# translation DOF `dz` along the cube z axis, ranged and firmware-actuatable.
# The DOF name is the ONE name everywhere (WP-42): it is the fx parameter
# name AND the module's axis-map `dof` — keep them identical.
kind: mechanical_template
id: openuc2.tpl.z_motor
version: 0.1.0
class: adaptive
description: Starter motorized z-stage (±2.5 mm actuated travel)
tags: [starter, stage, actuated]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
dof:
  - name: dz
    kind: translation
    axis: z
    range: [-2.5, 2.5]
    resolution: 0.05
    unit: mm
    actuatable: true
footprint_grid: [1, 1, 1]
