# WP-19 placeholder: a laser-pointer housing for a 1x1 cube. The geometry is
# schematic (model.step is the mechanical source of truth; model.glb is the
# render-only exchange copy) but the datum contract is real: the component's
# `emit` frame sits at the FRONT aperture, +20 mm along local z.
kind: mechanical_template
id: openuc2.tpl.laser_pointer_1x1
version: 0.1.2
class: fixed
description: Placeholder laser-pointer housing (emission aperture at z = +20 mm)
tags: [placeholder, insert/laser]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
mesh-pose:
  rotation:
    kind: grid
    grid:
      z: -z
      x: +y
glb: model.glb
step: model.step
footprint_grid: [1, 1, 1]
locked: true
insert-pose:
  rotation:
    kind: grid
    grid:
      z: +x
      x: +y
