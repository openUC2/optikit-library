# The starter lens mount — a T1 fixed template (WP-68). The optic sits at
# the cube center; the `frames` block states where the mechanics HOLD it
# (verify-t1 checks the bound component's optical frame lands here). No
# glb/step is declared because none ships — the index only advertises
# meshes that are actually on disk (WP-58).
kind: mechanical_template
id: openuc2.tpl.starter_50mm
version: 0.1.0
class: fixed
description: Starter 1x1 lens mount (optic held at the cube center)
tags: [starter, insert/lens]
envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
frames:
  optical: {z-mm: 0.0}
optical_ports:
  front: {frame: optical, direction: -z}
  back: {frame: optical, direction: +z}
footprint_grid: [1, 1, 1]
