# WP-109: the real openUC2 45° mirror cube, exported from Inventor
# (ASS - 2004 - CUBMIR45°TH1 - V03). The mesh IS the whole cube — half-shells,
# the INSMIR45TH1 insert, the adhesive pad and the mirror quad — measured
# 49.8 × 49.8 × 54.4 mm and centred exactly on the part origin, so no
# mesh-offset is needed and none is written.
#
# This record was a WP-43 CSV migration that pointed `glb-url` at the TH2 V04
# cube in the Store repo — a DIFFERENT part. It now carries a local TH1 V03
# file instead; the remote pointer is deliberately dropped rather than left
# naming a mesh this record does not hold.
kind: mechanical_template
id: openuc2.tpl.mirror_1x1
version: 0.2.0
class: fixed
description: openUC2 45° mirror cube (Inventor ASS - 2004 - CUBMIR45TH1 - V03)
tags:
  - migrated
  - cube
  - insert/mirror
envelope:
  x-mm: 50.0
  y-mm: 50.0
  # The stacking axis: the mesh measures 54.4 mm here, which is the 55 mm grid
  # pitch minus the puzzle-joint clearance.
  z-mm: 55.0
glb: ASS_-_2004_-_CUBMIR45°TH1_-_V03.glb
thumbnail: thumbnail.png
# The mesh is the whole cube, not an insert dropped into someone else's shell.
provenance: whole-module
# Where the mechanics hold the optic (WP-35 verify-t1): the reflective plane
# passes through the cube centre. Without this, verify-t1 warns
# W_NO_INSERT_FRAME and its "OK" is vacuous — it never compares a pose.
frames:
  optical: {z-mm: 0.0}
optical_ports:
  front: {frame: optical, direction: -z}
footprint_grid:
  - 1
  - 1
  - 1
review:
  - auto-migrated from the legacy CSV palette (WP-43) — confirm the record
  - the mesh is TH1 V03; the migrated record originally named TH2 V04
