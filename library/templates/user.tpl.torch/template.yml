kind: mechanical_template
id: user.tpl.torch
version: 0.1.0
class: fixed
description: housing for user.source.torch (attached from ASS - 4004 - TOR+BAT.stp)
tags:
- bound
# Declared in the same frame the mesh-pose below states (identity grid: file
# axes are record axes): the body runs along z, the emission axis. The old
# values had y and z swapped - they were computed under the mesh-frame:record
# unwrap, which an explicit mesh-pose grid overrides.
envelope:
  x-mm: 34.14
  y-mm: 34.14
  z-mm: 125.91
step: ASS - 4004 - TOR+BAT.stp
glb: ASS - 4004 - TOR+BAT.glb
mesh-pose:
  rotation:
    kind: grid
    grid:
      z: +z
      x: +x
  translation:
    offset-mm:
      z: 30
optical_ports:
  out:
    frame: optical
    direction: -z
footprint_grid:
insert-pose:
  rotation:
    kind: grid
    grid:
      z: -z
      x: +x
  translation:
    offset-mm:
      z: -20
component: user.source.torch@^0.1
frames:
  optical:
    x-mm: 0
    y-mm: 0
    z-mm: -20
