optikit-version: v0.0.0-alpha.1
design:
  name: mirror-kinematic
  version: 0.1.0
  description: openuc2.mirror.flat in a cube — 24 seat(s)
inputs: {}
components:
  flat:
    kind: primitive
    category: mirror
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0.0
            interaction_model:
              type: refractive_reflective
              is_reflective: true
            semi_aperture: 12.5
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: -x
          x: +y
        offset-deg:
          y: -45
variants:
  seat-pz-px:
    description: as authored — the insert's home seat
  seat-px-py:
    description: insert seated +x / +y
    components:
      flat:
        pose:
          rotation:
            kind: grid
            grid:
              z: -y
              x: +z
            offset-deg:
              y: -45.0
  seat-px-my:
