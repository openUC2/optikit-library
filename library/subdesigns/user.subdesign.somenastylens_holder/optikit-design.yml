optikit-version: v0.0.0-alpha.1
design:
  name: somenastylens-holder
  version: 0.1.0
  description: user.lens.somenastylens in a generated holder, beam along +x
  tags:
    - composition/cube-mounted
components:
  somenastylens:
    kind: primitive
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: 50
              conic: 0
            material_post:
              type: Material
              name: N-BK7
            thickness: 8
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -50
              conic: 0
            semi_aperture: 12.7
      frames:
        optical: {}
      ports:
        front:
          frame: optical
          direction: -z
        back:
          frame: optical
          direction: +z
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: -z
      translation:
        offset-mm:
          x: 3.3958
          y: 0.3261
    tags:
      - procurement/buy
  cartridge-back:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: model.back.glb
        step: model.back.step
    pose:
      rotation:
        kind: grid
    tags:
      - procurement/3d-print
  cartridge-front:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: model.front.glb
        step: model.front.step
    pose:
      rotation:
        kind: grid
    tags:
      - procurement/3d-print
  master-insert-notched:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: model.master_notched.glb
        step: model.master_notched.step
    pose:
      rotation:
        kind: grid
    tags:
      - procurement/buy
      - in/kit/qbox
  master-insert-smooth:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: model.master_smooth.glb
        step: model.master_smooth.step
    pose:
      rotation:
        kind: grid
    tags:
      - procurement/buy
      - in/kit/qbox
  cube-shell:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: cube-shell.glb
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +y
    tags:
      - procurement/buy
      - in/kit/qbox
