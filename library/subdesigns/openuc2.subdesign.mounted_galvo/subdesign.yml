# Library subdesign: the dual-axis galvo, decomposed (WP-202).
#
# The optical side of openuc2.cube.galvo_sub. This is the part that spent
# three review rounds not fitting the record trio (DOCS/archive/PROPOSAL-MULTI-ELEMENT.md):
# as ONE optical_component it needed owner-frame datums for per-mirror
# position, a `surface:` index on each DOF to say which mirror it tilts, a
# pivot frame per mirror, and orientations that could only be DERIVED from
# the port bisector chain because a record cannot state them. Here each
# mirror is an ordinary component with an ordinary pose and an ordinary
# `dof:` block, and every one of those special cases dissolves.
