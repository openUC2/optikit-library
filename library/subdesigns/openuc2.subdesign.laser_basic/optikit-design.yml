  version: 0.1.0
  description: openuc2.source.laser_basic in a cube — 24 seat(s)
inputs: {}
components:
  laser-basic:
    kind: primitive
    category: source
    optics:
      frames:
        optical: {}
    source:
      wavelengths_um:
        - 0.488
        - 0.635
      divergence_deg: 1.0
    pose:
