optikit-version: v0.0.0-alpha.1
design:
  name: lens-50mm-simple
  version: 0.1.0
  description: user.lens.lens_50mm_simple in a cube — 2 seat(s)
inputs: {}
components:
  lens-50mm-simple:
    kind: primitive
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: 50.0
              conic: 0.0
            material_post:
              type: Material
              name: BK7G18
            thickness: 10
            semi_aperture: 20
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -50.0
              conic: 0.0
            semi_aperture: 20
      frames:
        optical: {}
      ports:
        front:
          frame: optical
          direction: -z
        back:
          frame: optical
          direction: +z
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +x
variants:
  seat-pz-px:
    description: as authored — the insert's home seat
  seat-mx-pz:
    description: insert seated -x / +z
    components:
      lens-50mm-simple:
        pose:
          rotation:
            kind: grid
            grid:
              z: -x
              x: +z
