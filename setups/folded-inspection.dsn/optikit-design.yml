# Starter setup: a folded inspection arm.
#
# torch -> 45-degree mirror (the cube_45_fixed glass) -> eyepiece -> camera.
# The beam runs +z from the lantern, the mirror folds it into -x, and the
# imaging arm continues along -x to the sensor. This is the starter that
# exercises a REFLECTION: if this one discovers and the straight relay-4f
# does too, a failure elsewhere is not the fold geometry.
#
# No `paths:` block — discovery finds the beam from the terminals alone.
# The mirror optics are the user.mirror.cube_45_fixed record verbatim, in the
# record's own frame (front -z, reflected -x); placed with the identity
# rotation, the record's axes ARE the world axes.
optikit-version: v0.0.0-alpha.1

design:
  name: folded-inspection
  version: 0.1.0
  description: Lantern folded 90 degrees by the 45-degree mirror into the eyepiece and camera
  tags:
    - starter
    - folded

components:
  torch:
    type: primitive
    category: source
    source:
      wavelengths_um: [0.532]
      divergence_deg: 10
      beam_diameter_mm: 20
    optics:
      frames:
        optical: {z-mm: 0.0}
      ports:
        out: {frame: optical, direction: +z, roles: [emitter]}
      emission:
        port: out
        spectrum: [{wavelength_um: 0.532, weight: 1.0}]
        spatial: {type: disc, radius_mm: 10.0}
        angular: {type: cone, half_angle_deg: 5.0}
        flux: 1.0
    template:
      class: fixed
      envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
    pose:
      rotation:
        type: grid

  mirror:
    type: primitive
    category: mirror
    optics:
      frames:
        optical: {z-mm: 0.0}
      ports:
        front: {frame: optical, direction: -z}
        reflected: {frame: optical, direction: -x, after-surface: 0}
      fragment:
        surfaces:
          - type: standard
            geometry: {type: StandardGeometry, radius: .inf, conic: 0.0}
            material_post: {type: Material, name: N-BK7}
            interaction_model: {type: refractive_reflective, is_reflective: true}
            semi_aperture: 17.0
    template:
      class: fixed
      envelope: {x-mm: 50, y-mm: 50, z-mm: 55}
    pose:
      rotation:
        type: grid
      translation:
        anchor: torch
        offset-mm: {z: 60.0}

  eyepiece:
    type: primitive
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry: {type: StandardGeometry, radius: 50.0, conic: 0.0}
            material_post: {type: Material, name: N-BK7}
            thickness: 4.0
            semi_aperture: 12.7
          - type: standard
            geometry: {type: StandardGeometry, radius: -50.0, conic: 0.0}
            semi_aperture: 12.7
      frames:
        optical: {z-mm: 0.0}
        exit: {z-mm: 4.0}
      ports:
        front: {frame: optical, direction: -z}
        back: {frame: exit, direction: +z, after-surface: 1}
    template:
      class: fixed
      envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
    pose:
      rotation:
        # Local +z along world -x: the imaging arm.
        type: grid
        grid: {z: -x, x: +z}
      translation:
        anchor: mirror
        offset-mm: {x: -30.0}

  camera:
    type: primitive
    category: detector
    optics:
      frames:
        optical: {z-mm: 0.0}
      ports:
        sensor: {frame: optical, direction: -z, roles: [sensor]}
    template:
      class: fixed
      envelope: {x-mm: 50, y-mm: 50, z-mm: 50}
    pose:
      rotation:
        type: grid
        grid: {z: -x, x: +z}
      translation:
        # Eyepiece exit (-34) plus its ~49 mm back focus along -x.
        anchor: mirror
        offset-mm: {x: -83.0}
