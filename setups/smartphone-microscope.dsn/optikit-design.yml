          y-mm: 0
          z-mm: 0
      ports:
        front:
          frame: optical
          direction: +x
        reflected:
          frame: optical
          direction: -y
          after-surface: 0
    pose:
      rotation:
        type: grid
        grid:
          x: -y
      translation:
        offset-grid:
          y: -2
    mounting:
      rotation:
        type: grid
        grid:
          z: -y
          x: -x
  cube-base-2:
