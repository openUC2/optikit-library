optikit-version: v0.0.0-alpha.1
design:
  name: Smartphone Microscope
  description: This is the smartphone Microscope also found in the coreBOX
  tags:
    - Microscope
    - Smartphone
    - Finite-corrected
components:
  torch:
    type: primitive
    primitive:
      static-models:
        gltf: user.source.torch
    category: source
    optics:
      emission:
        port: out
        spectrum:
          - wavelength_um: 0.532
            weight: 1
        spatial:
          type: disc
          radius_mm: 10
        angular:
          type: cone
          half_angle_deg: 5
        flux: 1
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
        out:
          x-mm: 0
          y-mm: 0
          z-mm: -20
      ports:
        out:
          frame: out
          direction: -z
    pose:
      rotation:
        type: grid
      translation:
        offset-grid:
          z: 3
    source:
      wavelengths_um:
        - 0.532
      beam_diameter_mm: 20
  stage-manual:
    type: primitive
    primitive:
      static-models:
        gltf: user.cube.stage_manual
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: 50
              conic: 0
            material_post:
              type: Material
              name: N-BK7
            thickness: 4
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -50
              conic: 0
            semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: -50
          z-mm: 0
        front:
          x-mm: 0
          y-mm: -50
          z-mm: 0
        back:
          x-mm: 0
          y-mm: -50
          z-mm: 0
      ports:
        front:
          frame: front
          direction: -z
        back:
          frame: back
          direction: +z
          after-surface: 1
    pose:
      rotation:
        type: grid
      translation:
        offset-grid:
          y: 1
          z: 1
  cube-base:
    type: primitive
    primitive:
      static-models:
        gltf: user.cube.cube_base
    category: other
    optics:
      passthrough: true
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
      ports:
        front:
          frame: optical
          direction: -x
        back:
          frame: optical
          direction: +x
    pose:
      rotation:
        type: grid
      translation:
        offset-grid:
          y: -1
  cube-45-fixed:
    type: primitive
    primitive:
      static-models:
        gltf: user.cube.cube_45_fixed
    category: mirror
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            material_post:
              type: Material
              name: N-BK7
            interaction_model:
              type: refractive_reflective
              is_reflective: true
            semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
      ports:
        front:
          frame: optical
          direction: +x
        reflected:
          frame: optical
          direction: -y
          after-surface: 0
    pose:
      rotation:
        type: grid
        grid:
          x: -y
      translation: {}
    mounting:
      rotation:
        type: grid
        grid:
          z: +y
  cube-45-fixed-2:
    type: primitive
    primitive:
      static-models:
        gltf: user.cube.cube_45_fixed
    category: mirror
    optics:
