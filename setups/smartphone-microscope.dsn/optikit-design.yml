              name: N-BK7
            thickness: 4
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -50
              conic: 0
            semi_aperture: 12.7
      frames:
        optical:
          x-mm: 0
          y-mm: 0
          z-mm: 0
      ports:
        front:
          frame: optical
          direction: -z
        back:
          frame: optical
          direction: +z
          after-surface: 1
    pose:
      rotation:
        type: grid
      translation:
        offset-grid:
          y: -2
          z: 1
