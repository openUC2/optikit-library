optikit-version: v0.0.0-alpha.1
design:
  name: Michelson Interferometer
  version: 0.1.0
  description: This is a simple setup for a michelson interferometer
  tags:
  - Inteferometer
  - Michelson
components:
  laser-520-pointer:
    kind: design
    category: source
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: +y
      translation:
        offset-grid:
          x: -1
          y: -1
    design: designs/user.cube.laser_520_pointer
  beamsplitter-cube-50:
    kind: design
    category: beamsplitter
    pose:
      rotation:
        kind: grid
        grid:
          z: +y
          x: +x
        offset-deg:
          y: 45.0
      translation:
        offset-grid:
          x: 2
          y: -1
    design: designs/user.cube.beamsplitter_cube_50
  mirror-kinematic:
    kind: design
    category: mirror
    pose:
      rotation:
        kind: grid
        grid:
          z: +x
          x: +y
      translation:
        offset-grid:
          x: 3
          y: -1
    design: designs/user.cube.mirror_kinematic
  mirror-kinematic-2:
    kind: design
    category: mirror
    pose:
      rotation:
        kind: grid
        grid:
          z: -y
          x: +x
      translation:
        offset-grid:
          x: 2
          y: -2
    design: designs/user.cube.mirror_kinematic
