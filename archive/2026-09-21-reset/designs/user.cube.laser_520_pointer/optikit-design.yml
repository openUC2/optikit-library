optikit-version: v0.0.0-alpha.1
design:
  description: laser_520_pointer in a 1x2 cube (bound)
  tags:
    - cube-module
components:
  body:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: templates/user.tpl.laser_520_pointer/ASS - 2018 - CUBLAS520 - V04 - A.glb
        step: templates/user.tpl.laser_520_pointer/ASS - 2018 - CUBLAS520 - V04 - A.stp
    pose:
      rotation:
        kind: grid
  optic:
    kind: primitive
    category: source
    optics:
      frames:
        optical: {}
      emission:
        spectrum:
          - wavelength_um: 0.532
        spatial:
          type: disc
          radius_mm: 2.5
    pose:
      rotation:
        kind: grid
        grid:
          z: -y
          x: +x
      translation:
        offset-mm:
          y: -20
