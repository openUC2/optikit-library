optikit-version: v0.0.0-alpha.1
design:
  description: user.source.led_matrix in a cube — 2 seat(s)
  tags:
    - seats
inputs: {}
components:
  led-matrix:
    kind: primitive
    category: source
    optics:
      frames:
        optical: {}
      emission:
        spectrum:
          - wavelength_um: 0.532
        spatial:
          type: disc
          radius_mm: 10.0
        angular:
          type: cone
          half_angle_deg: 0.5
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +x
  body:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: templates/user.tpl.led_matrix/ASS - 2046 - CUBLEDMTX - V04.glb
        step: templates/user.tpl.led_matrix/ASS - 2046 - CUBLEDMTX - V04.stp
    pose:
      rotation:
        kind: grid
        grid:
          z: -z
          x: +x
variants:
  seat-pz-px:
    description: as authored — the insert's home seat
  seat-mz-px:
    description: insert seated -z / +x
    components:
      led-matrix:
        pose:
          rotation:
            kind: grid
            grid:
              z: -z
              x: +x
