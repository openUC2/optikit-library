optikit-version: v0.0.0-alpha.1
design:
  description: cubglv in a 2x2 cube (bound)
  tags:
    - cube-module
components:
  body:
    kind: primitive
    category: mechanics
    pose:
      rotation:
        kind: grid
        grid:
          z: -z
          x: +x
  optic:
    kind: primitive
    category: mirror
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            material_post:
              type: Material
              name: N-BK7
            thickness: 6
            interaction_model:
              type: refractive_reflective
              is_reflective: true
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            thickness: 1
            interaction_model:
              type: refractive_reflective
              is_reflective: true
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            semi_aperture: 12.7
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: -x
          x: +z
        offset-deg:
          y: 45
      translation:
        offset-mm:
          x: 0.1
          y: -4.75
          z: 0.65
