optikit-version: v0.0.0-alpha.1
design:
  description: stage_motorized in a 2x3 cube (bound)
  tags:
    - cube-module
components:
  body:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: templates/user.tpl.stage_motorized/ASS - 3002 - CASAUTSTGR22 - A.glb
        step: templates/user.tpl.stage_motorized/ASS - 3002 - CASAUTSTGR22 - A.stp
    pose:
      rotation:
        kind: grid
        grid:
          z: -z
          x: +y
  optic:
    kind: primitive
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: 50.0
              conic: 0.0
            material_post:
              type: Material
              name: N-BK7
            thickness: 4
            semi_aperture: 12.7
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -50.0
              conic: 0.0
            semi_aperture: 12.7
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: -x
      translation:
        offset-mm:
          x: -50
          z: -10
