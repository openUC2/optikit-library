optikit-version: v0.0.0-alpha.1
design:
  description: user.sample.my_next_xyz_stage_2, decomposed (motion as inputs)
  tags:
    - decomposed
inputs:
  dz:
    kind: float64
    units: mm
    min: -5.0
    max: 5.0
    resolution: 0.05
  dx:
    kind: float64
    units: mm
    min: -5.0
    max: 5.0
    resolution: 0.05
components:
  my-next-xyz-stage-2:
    kind: primitive
    category: sample
    optics:
      frames:
        optical: {}
      passthrough: true
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +x
      translation:
        offset-mm:
          x: ~ 0.36 + inputs['dx'].value
          y: 1.17
          z: ~ 64.88 + inputs['dz'].value
  body:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: templates/user.tpl.my_next_xyz_stage_2/ASS - 3006 - AUTXYZSTG - V04 - A__for OST.glb
        step: templates/user.tpl.my_next_xyz_stage_2/ASS - 3006 - AUTXYZSTG - V04 - A__for OST.stp
    pose:
      rotation:
        kind: grid
