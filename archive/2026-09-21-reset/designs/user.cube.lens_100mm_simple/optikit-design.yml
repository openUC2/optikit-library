optikit-version: v0.0.0-alpha.1
design:
  description: user.lens.lens_100mm_simple in a cube — 2 seat(s)
  tags:
    - seats
inputs: {}
components:
  lens-100mm-simple:
    kind: primitive
    category: lens
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: 100.0
              conic: 0.0
            material_post:
              type: Material
              name: BK7G18
            thickness: 10
            semi_aperture: 20
          - type: standard
            geometry:
              type: StandardGeometry
              radius: -100.0
              conic: 0.0
            semi_aperture: 20
      frames:
        optical: {}
    pose:
      rotation:
        kind: grid
        grid:
          z: +z
          x: +x
  body:
    kind: primitive
    category: mechanics
    primitive:
      static-models:
        gltf: templates/user.tpl.lens_100mm_simple/ASS - 2022 - CUBLEND40F100 - V04.glb
        step: templates/user.tpl.lens_100mm_simple/ASS - 2022 - CUBLEND40F100 - V04.stp
    pose:
      rotation:
        kind: grid
variants:
  seat-pz-px:
    description: as authored — the insert's home seat
  seat-mx-pz:
    description: insert seated -x / +z
    components:
      lens-100mm-simple:
        pose:
          rotation:
            kind: grid
            grid:
              z: -x
              x: +z
